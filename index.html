<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CoreCodeSolution — Elite Software Services and Business Automation Agency. Custom software, n8n workflow automation, cloud architecture, and IT consulting." />
    <title>CoreCodeSolution | Software Services & Business Automation</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Netlify Forms: static form declaration for build-time detection.
         The actual submission is handled via fetch in ContactCTA.vue. -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
